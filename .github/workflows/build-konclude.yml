name: Build Konclude (Windows / Linux / macOS)

# Builds this modified Konclude (see README.md) on all three platforms, the
# same way upstream Konclude publishes prebuilt binaries for each -- except
# these builds are dynamically linked against Qt on every platform
# (upstream's Linux/macOS builds are statically linked against a
# custom-built Qt, which needs a much heavier build step we don't do here).
# A dynamic build just needs Qt's shared libraries available alongside the
# binary at runtime, exactly like the Windows build we already use.
#
# Run manually from the Actions tab (workflow_dispatch), or automatically
# whenever the Konclude source/project files change.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/**'
      - '*.pro'
      - '*.pri'
      - '.github/workflows/build-konclude.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Konclude-Windows-x64-MSVC-Dynamic-Qt5.15.2
          - os: ubuntu-22.04
            artifact_name: Konclude-Linux-x64-GCC-Dynamic-Qt5.15.2
          - os: macos-latest
            artifact_name: Konclude-macOS-x64-Clang-Dynamic-Qt5.15.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Set up MSVC environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Qt 5.15.2's headers still call the old MSVC STL helper
          # stdext::make_checked_array_iterator, which Microsoft has since
          # removed from newer toolsets (fails with "'stdext' is not a
          # class or namespace name" on whatever ships as default on the
          # runner). Pin the older VS2019-era (v142) toolset, matching what
          # actually builds Qt 5.15.2 locally, instead of the runner's
          # newest preinstalled compiler.
          toolset: 14.29

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          qmake KoncludeWithoutRedland.pro -spec win32-msvc
          nmake

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential
          # Committed from Windows, where git doesn't track the executable
          # bit -- the checked-out script is otherwise non-executable here.
          chmod +x UnixGitBuildScript.sh
          qmake KoncludeWithoutRedland.pro
          make -j"$(nproc)"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x UnixGitBuildScript.sh
          qmake KoncludeWithoutRedland.pro
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package build output
        shell: bash
        run: |
          set -eu
          mkdir -p dist/Binaries dist/Configs
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp Release/Konclude.exe dist/Binaries/
            # Qt's runtime DLLs, so the package is self-contained like our
            # existing Windows build.
            QT_BIN="$(qmake -query QT_INSTALL_BINS)"
            cp "$QT_BIN/Qt5Core.dll" "$QT_BIN/Qt5Network.dll" "$QT_BIN/Qt5Xml.dll" "$QT_BIN/Qt5Concurrent.dll" dist/Binaries/
          else
            cp Release/Konclude dist/Binaries/
            chmod +x dist/Binaries/Konclude
          fi
          cp -r Configs/. dist/Configs/ 2>/dev/null || true
          cp materialize.bat dist/ 2>/dev/null || true
          cp GPL.txt LGPL-3.0.txt dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist

  docker:
    # The actual "runs the same regardless of environment" option (see
    # Dockerfile) -- builds and (on pushes to main) publishes a
    # self-contained image, verified locally to build and reason correctly
    # before this workflow was written.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image tag
        id: image
        # ghcr.io requires an all-lowercase repository name; our org name
        # (ISE-FIZKarlsruhe) isn't, and Actions expressions have no
        # built-in lower() function, so lowercase it in shell instead.
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/konclude:latest

  appimage:
    # Single-file Linux image built on Ubuntu 22.04 (older glibc than ubuntu-latest, so it also runs on older systems).
    # It only uploads an artifact, nothing is published. A failure here does not fail the whole workflow.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake pkg-config librdf0-dev libraptor2-dev librasqal3-dev libxml2-dev libjemalloc-dev
          sudo ln -sf /usr/include/redland.h /usr/include/Redland.h

      - name: Build (with Redland, as the Docker image)
        run: |
          qmake KoncludeRedlandLinux.pro
          make -j"$(nproc)"

      - name: Package the AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool tools/make-appimage.sh
          mkdir -p out
          KONCLUDE_VERSION="$(date +%d%m%Y)-${GITHUB_SHA::7}" tools/make-appimage.sh Release/Konclude out "$PWD/appimagetool"

      - uses: actions/upload-artifact@v4
        with:
          name: Konclude-Linux-x64-AppImage
          path: out/*.AppImage
